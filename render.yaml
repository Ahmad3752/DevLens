services:
  - type: web
    runtime: docker
    name: devlens
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: OPENROUTER_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_BASE
        value: https://openrouter.ai/api/v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEVLENS_REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: false
